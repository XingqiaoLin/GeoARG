interface:
  display_name: "Novel ARG watch"
  short_description: "Date-gate novel resistance genes and quote the validating experiment"
  default_prompt: "Use $novel-arg-watch to search antimicrobial resistance genes after a cutoff date, cross-validate preprints before treating any gene as novel, and quote the full-text sentence that proves each gene was experimentally validated."
policy:
  allow_implicit_invocation: true
